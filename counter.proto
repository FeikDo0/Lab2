
syntax = "proto3";

package counter;

service Counter {
    rpc Increment (IncrementRequest) returns (IncrementReply);
    rpc Get (GetRequest) returns (GetReply);
    rpc Restore (RestoreRequest) returns (RestoreReply);
}

message IncrementRequest {
    string counter_id = 1;
    int64 delta = 2;
    string idempotency_key = 3;
    uint64 lamport_time = 4;
}

message IncrementReply {
    int64 new_value = 1;
    bool was_duplicate = 2;
    uint64 lamport_time = 4;
}

message GetRequest {
    string counter_id = 1;
    uint64 lamport_time = 4;
}

message GetReply {
    int64 value = 1;
    bool found = 2;
    uint64 lamport_time = 4;
}

message RestoreRequest {
    string counter_id = 1;
    int64 value = 2;
    uint64 version = 3;
    uint64 lamport_time = 4;
}

message RestoreReply {
    bool success = 1;
    uint64 lamport_time = 2;
}
